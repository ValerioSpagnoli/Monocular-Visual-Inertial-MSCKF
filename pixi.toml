[workspace]
name = "monocular-visual-inertial-msckf"
version = "0.1.0"
description = "Multi-State Constraint Kalman Filter for Monocular Visual-Inertial Navigation"
authors = ["Valerio Spagnoli"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
# Core scientific computing
python = "3.11.*"
numpy = ">=1.24"
pandas = ">=2.0"
scipy = ">=1.10"

# Visualization
matplotlib = ">=3.7"
plotly = ">=5.0"
rerun-sdk = ">=0.43,<0.44"  # the logging API changes between minor releases

# Computer vision
opencv = ">=4.8"
pyyaml = ">=6.0"

# Deep learning (for XFeat)
pytorch = ">=2.0"

# Optimization and utilities
optuna = ">=3.0"
tqdm = "*"
pytest = ">=8.0"

# C++ core (cpp/): build tools, Eigen, Python bindings and unit tests
cmake = ">=3.18"
ninja = "*"
cxx-compiler = "*"
eigen = ">=3.4"
pybind11 = ">=2.11"
catch2 = ">=3.4"

# C++ application (cpp/app): XFeat inference, datasets, command line, visualization
onnxruntime-cpp = ">=1.20"
librerun-sdk = "==0.43.2"
yaml-cpp = ">=0.8"
cli11 = ">=2.4"

# Export of XFeat to ONNX (tools/export_xfeat_onnx.py)
onnx = "*"
onnxruntime = "*"

[target.linux-64.dependencies]
# CPU-only PyTorch build on Linux
pytorch-cpu = ">=2.0"

[activation.env]
PYTHONPATH = "${PIXI_PROJECT_ROOT}:${PIXI_PROJECT_ROOT}/src:${PIXI_PROJECT_ROOT}/src/accelerated_features:${PIXI_PROJECT_ROOT}/build/cpp:${PYTHONPATH}"
# Run on CPU the few ops not yet implemented for Apple GPUs
PYTORCH_ENABLE_MPS_FALLBACK = "1"

[tasks]
# Verification tasks
verify-installation = "python -c 'import numpy; import pandas; import scipy; import cv2; import torch; import matplotlib; import plotly; import optuna; import rerun as rr; import tqdm; print(\"✓ All core dependencies available\")'"
test-imports = "python -c 'from msckf.MSCKF import MSCKF; from msckf.Camera import Camera; from msckf.IMU import IMU; from msckf.FeatureExtractor import FeatureExtractor; from utils.geometry import Isometry3D; from utils.visualization_utils import Canvas3D; print(\"✓ All project modules imported successfully\")'"

# Tests
test = "pytest -q tests"

# C++ core
build-cpp = "cmake -S cpp -B build/cpp -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE=$(which python) && cmake --build build/cpp"
test-cpp = { cmd = "build/cpp/msckf_tests", depends-on = ["build-cpp"] }
build-android = "bash cpp/build_android.sh"

# Main experiment scripts
main = "python main.py"

[environments]
default = { solve-group = "default" }