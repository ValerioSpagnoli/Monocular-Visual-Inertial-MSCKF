[workspace]
name = "monocular-visual-inertial-msckf"
version = "0.2.0"
description = "Multi-State Constraint Kalman Filter for Monocular Visual-Inertial Navigation"
authors = ["Valerio Spagnoli"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
# Build tools
cmake = ">=3.18"
ninja = "*"
cxx-compiler = "*"

# Filter (src/core/): Eigen only, so it builds unchanged for Android
eigen = ">=3.4"

# Feature extraction (src/core/) and desktop application (src/app/): XFeat inference, images, datasets, command line, visualization
onnxruntime-cpp = ">=1.20"
libopencv = ">=4.8"
yaml-cpp = ">=0.8"
cli11 = ">=2.4"
librerun-sdk = "==0.43.2"
rerun-sdk = "==0.43.2"  # Rerun viewer (same version as the C++ SDK)

# Tests
catch2 = ">=3.4"

[tasks]
build = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build"
test = { cmd = "build/msckf_tests", depends-on = ["build"] }
main = { cmd = "build/msckf_run", depends-on = ["build"] }
benchmark = { cmd = "bash tools/benchmark.sh", depends-on = ["build"] }
build-android = "bash tools/build_android.sh"

# Export of XFeat to ONNX (only needed to regenerate models/xfeat.onnx): PyTorch and the XFeat submodule
[feature.export.dependencies]
python = "3.11.*"
numpy = ">=1.24"
pytorch = ">=2.0"
onnx = "*"
onnxruntime = "*"
tqdm = "*"

[feature.export.target.linux-64.dependencies]
pytorch-cpu = ">=2.0"

[feature.export.tasks]
export-xfeat = "python tools/export_xfeat_onnx.py"
export-liftfeat = "python tools/export_liftfeat_onnx.py"

[environments]
default = { solve-group = "default" }
export = { features = ["export"], solve-group = "default" }
